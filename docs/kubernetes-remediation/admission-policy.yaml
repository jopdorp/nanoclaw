# REVIEW ONLY. Do not apply to HOME until the CEL expressions have passed the
# adversarial ephemeral-k3s test matrix in approach-2-build-plan.md.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nanoclaw-remediator-workload-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments, statefulsets, daemonsets]
        scope: Namespaced
  matchConditions:
    - name: remediator-service-account
      expression: request.userInfo.username == 'system:serviceaccount:nanoclaw-remediator:nanoclaw-remediator'
  variables:
    - name: approvalRequiredNamespaces
      expression: "['wireguard-home']"
    - name: restartAnnotation
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: trustedRegistries
      expression: "['docker.io', 'docker.gitea.com', 'cr.fluentbit.io', 'ghcr.io', 'quay.io', 'registry.k8s.io', 'mirror.gcr.io', 'lscr.io', 'registry.prophet.jopdorp.nl', 'gitea.claw.jopdorp.nl']"
    - name: digestImagePattern
      expression: "'^(docker[.]io|docker[.]gitea[.]com|cr[.]fluentbit[.]io|ghcr[.]io|quay[.]io|registry[.]k8s[.]io|mirror[.]gcr[.]io|lscr[.]io|registry[.]prophet[.]jopdorp[.]nl|gitea[.]claw[.]jopdorp[.]nl)/[a-z0-9]+([._/-][a-z0-9]+)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?@sha256:[0-9a-f]{64}$'"
    - name: newAnnotations
      expression: "has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}"
    - name: oldAnnotations
      expression: "has(oldObject.spec.template.metadata.annotations) ? oldObject.spec.template.metadata.annotations : {}"
    - name: newObjectAnnotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
    - name: oldObjectAnnotations
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: newContainers
      expression: object.spec.template.spec.containers
    - name: oldContainers
      expression: oldObject.spec.template.spec.containers
    - name: newInitContainers
      expression: "has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : []"
    - name: oldInitContainers
      expression: "has(oldObject.spec.template.spec.initContainers) ? oldObject.spec.template.spec.initContainers : []"
    # [image, repository] pairs, the repository canonicalised like the host's parseImage: no tag or digest, docker.io/library/ for bare names.
    - name: imagePaths
      expression: >-
        (variables.newContainers + variables.oldContainers + variables.newInitContainers + variables.oldInitContainers)
          .map(c, [string(c.image), string(c.image).find('^([^@:/]*(:[^@/]*)?/)*[^@:/]*')])
    - name: imageQualified
      expression: >-
        variables.imagePaths.map(e, [e[0], variables.trustedRegistries.exists(r, e[1].startsWith(r + '/')) ? e[1] : 'docker.io/' + e[1]])
    - name: imageRepos
      expression: >-
        variables.imageQualified.map(e, [e[0], e[1].matches('^docker[.]io/[^/]+$') ? 'docker.io/library/' + e[1].substring(10) : e[1]])
  validations:
    - expression:' "!((has(request.namespace) ? request.namespace : '''') in [''kube-system'', ''longhorn-system''])"'
      message: kube-system and longhorn-system are written only by the break-glass identity
    - expression: >-
        !((has(request.namespace) ? request.namespace : '') in variables.approvalRequiredNamespaces) ||
        (has(oldObject.metadata.annotations) &&
         'remediation.nanoclaw.io/approval-id' in oldObject.metadata.annotations &&
         oldObject.metadata.annotations['remediation.nanoclaw.io/approval-id'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
      message: always-ask remediation requires a proxy-verified per-action Matrix approval annotation
    - expression: >-
        dyn(object).all(k, k in ['metadata', 'spec'] || (k in dyn(oldObject) && dyn(object)[k] == dyn(oldObject)[k])) &&
        dyn(oldObject).all(k, k in ['metadata', 'spec'] || (k in dyn(object) && dyn(oldObject)[k] == dyn(object)[k]))
      message: only spec may change
    - expression: >-
        dyn(object.metadata).all(k, k in ['annotations', 'generation', 'managedFields', 'resourceVersion'] || (k in dyn(oldObject.metadata) && dyn(object.metadata)[k] == dyn(oldObject.metadata)[k])) &&
        dyn(oldObject.metadata).all(k, k in ['annotations', 'generation', 'managedFields', 'resourceVersion'] || (k in dyn(object.metadata) && dyn(oldObject.metadata)[k] == dyn(object.metadata)[k]))
      message: workload metadata is immutable
    - expression: >-
        variables.newObjectAnnotations.all(k, (request.resource.resource == 'daemonsets' && k == 'deprecated.daemonset.template.generation') || (k in variables.oldObjectAnnotations && variables.newObjectAnnotations[k] == variables.oldObjectAnnotations[k])) &&
        variables.oldObjectAnnotations.all(k, (request.resource.resource == 'daemonsets' && k == 'deprecated.daemonset.template.generation') || (k in variables.newObjectAnnotations && variables.oldObjectAnnotations[k] == variables.newObjectAnnotations[k]))
      message: workload annotations are immutable
    - expression: >-
        dyn(object.spec).all(k, k in ['replicas', 'template'] || (k in dyn(oldObject.spec) && dyn(object.spec)[k] == dyn(oldObject.spec)[k])) &&
        dyn(oldObject.spec).all(k, k in ['replicas', 'template'] || (k in dyn(object.spec) && dyn(oldObject.spec)[k] == dyn(object.spec)[k]))
      message: only replicas and the pod template may change; selectors are immutable
    - expression: >-
        dyn(object.spec.template).all(k, k in ['metadata', 'spec'] || (k in dyn(oldObject.spec.template) && dyn(object.spec.template)[k] == dyn(oldObject.spec.template)[k])) &&
        dyn(oldObject.spec.template).all(k, k in ['metadata', 'spec'] || (k in dyn(object.spec.template) && dyn(oldObject.spec.template)[k] == dyn(object.spec.template)[k]))
      message: only pod-template metadata and spec may change
    - expression: >-
        dyn(object.spec.template.metadata).all(k, k == 'annotations' || (k in dyn(oldObject.spec.template.metadata) && dyn(object.spec.template.metadata)[k] == dyn(oldObject.spec.template.metadata)[k])) &&
        dyn(oldObject.spec.template.metadata).all(k, k == 'annotations' || (k in dyn(object.spec.template.metadata) && dyn(oldObject.spec.template.metadata)[k] == dyn(object.spec.template.metadata)[k]))
      message: pod labels and other pod metadata are immutable
    - expression: >-
        variables.newAnnotations.all(k, k == variables.restartAnnotation || (k in variables.oldAnnotations && variables.newAnnotations[k] == variables.oldAnnotations[k])) &&
        variables.oldAnnotations.all(k, k == variables.restartAnnotation || (k in variables.newAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k]))
      message: only the kubectl restart annotation may change
    - expression: >-
        dyn(object.spec.template.spec).all(k, k in ['containers', 'initContainers'] || (k in dyn(oldObject.spec.template.spec) && dyn(object.spec.template.spec)[k] == dyn(oldObject.spec.template.spec)[k])) &&
        dyn(oldObject.spec.template.spec).all(k, k in ['containers', 'initContainers'] || (k in dyn(object.spec.template.spec) && dyn(oldObject.spec.template.spec)[k] == dyn(object.spec.template.spec)[k]))
      message: volumes, serviceAccountName, securityContext, hostNetwork, hostPID, hostIPC and all other pod spec fields are immutable
    - expression: >-
        variables.newContainers.size() == variables.oldContainers.size() &&
        variables.newContainers.map(c, c.name) == variables.oldContainers.map(c, c.name) &&
        variables.newContainers.all(c, variables.oldContainers.exists(oc, oc.name == c.name &&
          dyn(c).all(k, k == 'image' || (k in dyn(oc) && dyn(c)[k] == dyn(oc)[k])) &&
          dyn(oc).all(k, k == 'image' || (k in dyn(c) && dyn(oc)[k] == dyn(c)[k]))))
      message: container count/order/names, env, envFrom, volumeMounts, securityContext, hostPort and all fields other than image are immutable
    - expression: >-
        variables.newInitContainers.size() == variables.oldInitContainers.size() &&
        variables.newInitContainers.map(c, c.name) == variables.oldInitContainers.map(c, c.name) &&
        variables.newInitContainers.all(c, variables.oldInitContainers.exists(oc, oc.name == c.name &&
          dyn(c).all(k, k == 'image' || (k in dyn(oc) && dyn(c)[k] == dyn(oc)[k])) &&
          dyn(oc).all(k, k == 'image' || (k in dyn(c) && dyn(oc)[k] == dyn(c)[k]))))
      message: init-container count/order/names, env, envFrom, volumeMounts, securityContext, hostPort and all fields other than image are immutable
    # A rollback may unpin back to the exact tag the live digest was pinned from, never to another mutable tag.
    - expression: >-
        variables.newContainers.all(c,
          variables.oldContainers.exists(oc, oc.name == c.name &&
            (c.image == oc.image ||
              (oc.image.size() == c.image.size() + 72 && oc.image.startsWith(c.image + '@sha256:') && oc.image.matches('@sha256:[0-9a-f]{64}$')) ||
              (c.image.matches(variables.digestImagePattern) &&
               variables.imageRepos.exists(n, n[0] == c.image &&
                 variables.imageRepos.exists(o, o[0] == oc.image && o[1] == n[1]))))))
      message: a new container image must retain its repository and use a trusted registry sha256 digest
    - expression: >-
        variables.newInitContainers.all(c,
          variables.oldInitContainers.exists(oc, oc.name == c.name &&
            (c.image == oc.image ||
              (oc.image.size() == c.image.size() + 72 && oc.image.startsWith(c.image + '@sha256:') && oc.image.matches('@sha256:[0-9a-f]{64}$')) ||
              (c.image.matches(variables.digestImagePattern) &&
               variables.imageRepos.exists(n, n[0] == c.image &&
                 variables.imageRepos.exists(o, o[0] == oc.image && o[1] == n[1]))))))
      message: a new init-container image must retain its repository and use a trusted registry sha256 digest
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nanoclaw-remediator-workload-guard
spec:
  policyName: nanoclaw-remediator-workload-guard
  validationActions: [Deny, Audit]
---
# Scale is a distinct subresource and must not bypass the workload policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nanoclaw-remediator-scale-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments/scale, statefulsets/scale]
        scope: Namespaced
  matchConditions:
    - name: remediator-service-account
      expression: request.userInfo.username == 'system:serviceaccount:nanoclaw-remediator:nanoclaw-remediator'
  variables:
    - name: excludedNamespaces
      expression: "['kube-system', 'longhorn-system', 'wireguard-home']"
  validations:
    - expression:' "!((has(request.namespace) ? request.namespace : '''') in variables.excludedNamespaces)"'
      message: the scale subresource is allowed only in Lane A namespaces
    - expression: >-
        dyn(object).all(k, k == 'spec' || (k in dyn(oldObject) && dyn(object)[k] == dyn(oldObject)[k])) &&
        dyn(oldObject).all(k, k == 'spec' || (k in dyn(object) && dyn(oldObject)[k] == dyn(object)[k]))
      message: only scale spec may change
    - expression: >-
        dyn(object.spec).all(k, k == 'replicas' || (k in dyn(oldObject.spec) && dyn(object.spec)[k] == dyn(oldObject.spec)[k])) &&
        dyn(oldObject.spec).all(k, k == 'replicas' || (k in dyn(object.spec) && dyn(oldObject.spec)[k] == dyn(object.spec)[k]))
      message: only spec.replicas may change
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nanoclaw-remediator-scale-guard
spec:
  policyName: nanoclaw-remediator-scale-guard
  validationActions: [Deny, Audit]
---
# This static gate is necessary but not sufficient: the trusted proxy must
# verify the approval ID against a once-only Matrix approval bound to the exact
# UID, resourceVersion and expiry, add the annotation with its own identity,
# install the short-lived delete binding, issue the delete, and remove binding.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nanoclaw-remediator-storage-delete-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [persistentvolumeclaims, persistentvolumes]
  matchConditions:
    - name: remediator-service-account
      expression: request.userInfo.username == 'system:serviceaccount:nanoclaw-remediator:nanoclaw-remediator'
  validations:
    - expression: >-
        has(oldObject.metadata.annotations) &&
        'remediation.nanoclaw.io/approval-id' in oldObject.metadata.annotations &&
        oldObject.metadata.annotations['remediation.nanoclaw.io/approval-id'].matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      message: PV/PVC deletion requires a proxy-verified per-action Matrix approval annotation
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: nanoclaw-remediator-storage-delete-guard
spec:
  policyName: nanoclaw-remediator-storage-delete-guard
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: nanoclaw-remediator-job-delete-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [DELETE]
        resources: [jobs]
        scope: Namespaced
  matchConditions:
    - name: remediator-service-account
      expression: request.userInfo.username == 'system:serviceaccount:nanoclaw-remediator:nanoclaw-remediator'
  validations:
    - expression:' "!((has(request.namespace) ? request.namespace : '''') in [''kube-system'', ''longhorn-system''])"'
      message: kube-system and longhorn-system are written only by the break-glass identity
    - expression: >-
        (has(request.namespace) ? request.namespace : '') != 'wireguard-home' ||
        (has(oldObject.metadata.annotations) && 'remediation.nanoclaw.io/approval-id' in oldObject.metadata.annotations)
      message: always-ask remediation requires a proxy-verified per-action Matrix approval annotation
    - expression: >-
        has(oldObject.status.conditions) &&
        oldObject.status.conditions.exists(c, c.type in ['Complete', 'Failed'] && c.status == 'True') &&
        (!has(oldObject.status.active) || oldObject.status.active == 0)
      message: only a finished Job with no active pods may be deleted
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
