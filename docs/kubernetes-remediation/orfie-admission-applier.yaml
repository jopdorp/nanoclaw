# Admin copies nanoclaw-remediator/orfie-git-deploy-key here as gitea-repo-read before enabling the CronJob.
apiVersion: v1
kind: Namespace
metadata:
  name: orfie-admission-applier
  labels: { pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: applier, namespace: orfie-admission-applier }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: orfie-admission-applier }
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: orfie-admission-applier }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: orfie-admission-applier }
subjects: [{ kind: ServiceAccount, name: applier, namespace: orfie-admission-applier }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: applier, namespace: orfie-admission-applier }
data:
  apply.sh: |
    set -eu
    file=/w/src/kubernetes/orfie-admission.yaml
    test -s "$file" || exit 0
    rows=$(kubectl create --dry-run=client --validate=false -f "$file" -o jsonpath='{.kind}{"|"}{.metadata.name}{"|"}{.spec.policyName}{"|"}{.metadata.labels.nanoclaw\.dev/orfie-owned}{"\n"}')
    test -n "$rows"
    while IFS='|' read -r kind name policy owned; do
      case "$kind:$name:$owned" in
        ValidatingAdmissionPolicy:orfie-*:true) test -z "$policy" ;;
        ValidatingAdmissionPolicyBinding:orfie-*:true) case "$policy" in orfie-*) ;; *) exit 1 ;; esac ;;
        *) exit 1 ;;
      esac
    done <<EOF
    $rows
    EOF
    kubectl apply --server-side --dry-run=server -f "$file" >/dev/null
    kubectl apply --server-side -f "$file"
    desired=$(kubectl create --dry-run=client --validate=false -f "$file" -o name)
    for live in $(kubectl get validatingadmissionpolicies,validatingadmissionpolicybindings -l nanoclaw.dev/orfie-owned=true -o name); do
      printf '%s\n' "$desired" | grep -Fxq "$live" || kubectl delete "$live"
    done
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: applier, namespace: orfie-admission-applier }
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: applier
          restartPolicy: Never
          securityContext: { fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
          initContainers:
            - name: fetch
              image: alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
              command: [sh, -c, 'GIT_SSH_COMMAND="ssh -i /git/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/git/known_hosts" git clone -q --depth 1 ssh://git@gitea-ssh.gitea.svc.cluster.local:2222/cluster/k8s.jegor.nl.git /w/src']
              env: [{ name: HOME, value: /w }]
              securityContext: { runAsNonRoot: true, runAsUser: 65534, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: w, mountPath: /w }, { name: git, mountPath: /git, readOnly: true }]
          containers:
            - name: apply
              image: alpine/kubectl:1.35.0@sha256:862d86046bbcad03c252bbc10ab8bf893e7aa50aa7a20de8bfc46727dd645883
              command: [sh, /scripts/apply.sh]
              securityContext: { runAsNonRoot: true, runAsUser: 65532, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: w, mountPath: /w }, { name: scripts, mountPath: /scripts }]
          volumes:
            - { name: w, emptyDir: { sizeLimit: 20Mi } }
            - { name: git, secret: { secretName: gitea-repo-read, defaultMode: 256 } }
            - { name: scripts, configMap: { name: applier } }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: orfie-admission-applier-guard }
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: orfie-admission-applier } }
    resourceRules:
      - { apiGroups: ['*'], apiVersions: ['*'], operations: ['*'], resources: ['*/*'], scope: Namespaced }
  matchConditions:
    - { name: host-identity, expression: "request.userInfo.username.startsWith('system:serviceaccount:nanoclaw-remediator:')" }
  validations: [{ expression: 'false', message: Orfie cannot change its admission applier }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: orfie-admission-applier-guard }
spec: { policyName: orfie-admission-applier-guard, validationActions: [Deny, Audit] }
