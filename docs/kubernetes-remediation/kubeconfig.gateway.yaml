# No user credential belongs in this file. HTTPS_PROXY comes from OneCLI.
apiVersion: v1
kind: Config
clusters:
  - name: home-k3s-via-onecli
    cluster:
      server: https://kubernetes.default.svc:443
      certificate-authority: /tmp/onecli-combined-ca.pem
users:
  - name: onecli-injected-nanoclaw-remediator
    user: {}
contexts:
  - name: home-read-only
    context:
      cluster: home-k3s-via-onecli
      user: onecli-injected-nanoclaw-remediator
current-context: home-read-only
