---
# Namespaced reads are duplicated deliberately: there is no ClusterRole with
# namespaced read permissions that could later be bound cluster-wide by error.
apiVersion: v1
kind: List
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: nanoclaw-remediator-read
      namespace: nextcloud
    rules: &namespaced-read-rules
      - apiGroups: [""]
        resources:
          [
            configmaps,
            endpoints,
            events,
            limitranges,
            persistentvolumeclaims,
            pods,
            pods/log,
            resourcequotas,
            serviceaccounts,
            services,
          ]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
        verbs: [get, list, watch]
      - apiGroups: [batch]
        resources: [cronjobs, jobs]
        verbs: [get, list, watch]
      - apiGroups: [autoscaling]
        resources: [horizontalpodautoscalers]
        verbs: [get, list, watch]
      - apiGroups: [policy]
        resources: [poddisruptionbudgets]
        verbs: [get, list, watch]
      - apiGroups: [networking.k8s.io]
        resources: [ingresses, networkpolicies]
        verbs: [get, list, watch]
      - apiGroups: [discovery.k8s.io]
        resources: [endpointslices]
        verbs: [get, list, watch]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [rolebindings, roles]
        verbs: [get, list, watch]
      - apiGroups: [cert-manager.io]
        resources: [certificaterequests, certificates, issuers]
        verbs: [get, list, watch]
      - apiGroups: [acme.cert-manager.io]
        resources: [challenges, orders]
        verbs: [get, list, watch]
      - apiGroups: [traefik.io]
        resources:
          [
            ingressroutes,
            ingressroutetcps,
            ingressrouteudps,
            middlewares,
            middlewaretcps,
            serverstransports,
            serverstransporttcps,
            tlsoptions,
            tlsstores,
            traefikservices,
          ]
        verbs: [get, list, watch]
      - apiGroups: [aquasecurity.github.io]
        resources: [vulnerabilityreports]
        verbs: [get, list, watch]
      - apiGroups: [longhorn.io]
        resources:
          [
            backingimagedatasources,
            backingimagemanagers,
            backingimages,
            backupbackingimages,
            backups,
            backuptargets,
            backupvolumes,
            enginefrontends,
            engineimages,
            engines,
            instancemanagers,
            instancemanagerupgradecontrols,
            instancemanagerupgrades,
            nodes,
            orphans,
            recurringjobs,
            replicas,
            settings,
            shardgroups,
            shards,
            sharemanagers,
            snapshotgroups,
            snapshots,
            supportbundles,
            systembackups,
            systemrestores,
            volumeattachments,
            volumes,
          ]
        verbs: [get, list, watch]
  - &read-binding
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-remediator-read, namespace: nextcloud }
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: nanoclaw-remediator-read
    subjects: &remediator-subject
      - kind: ServiceAccount
        name: nanoclaw-remediator
        namespace: nanoclaw-remediator
  - &read-role
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-remediator-read, namespace: mail }
    rules: *namespaced-read-rules
  - <<: *read-binding
    metadata: { name: nanoclaw-remediator-read, namespace: mail }
  - <<: *read-role
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-remediator-read, namespace: gitea }
    rules: *namespaced-read-rules
  - <<: *read-binding
    metadata: { name: nanoclaw-remediator-read, namespace: gitea }
  - <<: *read-role
    metadata: { name: nanoclaw-remediator-read, namespace: monitoring }
  - <<: *read-binding
