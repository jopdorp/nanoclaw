    metadata: { name: nanoclaw-remediator-read, namespace: backups }
  - <<: *read-binding
    metadata: { name: nanoclaw-remediator-read, namespace: backups }
---
# Lane A writes in every namespace. RBAC cannot exclude namespaces, so
# admission-policy.yaml keeps this identity out of Lane C and nanoclaw-remediator,
# to the named Deployments in the always-ask namespaces, and to CronJob images
# in backups. PVC deletion is intentionally absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-lane-a
rules:
  - apiGroups: [apps]
    resources: [daemonsets, deployments, statefulsets]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-remediator-lane-a
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-lane-a }
subjects:
  - { kind: ServiceAccount, name: nanoclaw-remediator, namespace: nanoclaw-remediator }
---
# Always-ask access is name-scoped; admission-policy.yaml requires approval and
# permits only the official Vaultwarden image by digest.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nanoclaw-remediator-always-ask
  namespace: vaultwarden
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [vaultwarden]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nanoclaw-remediator-always-ask
  namespace: vaultwarden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nanoclaw-remediator-always-ask
subjects:
  - kind: ServiceAccount
    name: nanoclaw-remediator
    namespace: nanoclaw-remediator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nanoclaw-remediator-always-ask
  namespace: wireguard-home
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [wireguard]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nanoclaw-remediator-always-ask
  namespace: wireguard-home
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nanoclaw-remediator-always-ask
subjects:
  - kind: ServiceAccount
    name: nanoclaw-remediator
    namespace: nanoclaw-remediator
---
# The Trivy watcher lists reports across all namespaces; scan metadata only, read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-trivy-read
rules:
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, clustervulnerabilityreports]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-remediator-trivy-read
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-trivy-read }
subjects:
  - { kind: ServiceAccount, name: nanoclaw-remediator, namespace: nanoclaw-remediator }
---
# Helm path. Only the host's helm-values executor holds this identity (OneCLI
# agent nanoclaw-helm); the agent never does. Bound only in the namespaces of
# the allowlisted releases. It may write what those charts render, but never
# deletes a PVC; cluster-scoped writes are limited to the fluent-bit and
# trivy-operator RBAC, whose rules and subjects admission freezes. A values change
# that needs more fails and rolls back.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-helm
  namespace: nanoclaw-remediator
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: nanoclaw-helm-token
  namespace: nanoclaw-remediator
  annotations:
    kubernetes.io/service-account.name: nanoclaw-helm
---
apiVersion: v1
kind: List
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-helm-release, namespace: gitea }
    rules: &helm-release-rules
      - apiGroups: [""]
        resources: [configmaps, secrets, services, serviceaccounts]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [""]
        resources: [persistentvolumeclaims]
        verbs: [get, list, watch, create, update, patch]
      - apiGroups: [""]
        resources: [pods, events]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [deployments, statefulsets, daemonsets]
        verbs: [get, list, watch, create, update, patch]
      - apiGroups: [apps]
        resources: [replicasets, controllerrevisions]
        verbs: [get, list, watch]
      - apiGroups: [networking.k8s.io]
        resources: [ingresses, networkpolicies]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [policy]
        resources: [poddisruptionbudgets]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [roles, rolebindings]
        verbs: [get, list, watch]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-helm-release, namespace: nextcloud }
    rules: *helm-release-rules
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-helm-release, namespace: excalidraw }
    rules: *helm-release-rules
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-helm-release, namespace: wiki-js }
    rules: *helm-release-rules
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-helm-release, namespace: logging }
    rules: *helm-release-rules
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata: { name: nanoclaw-helm-release, namespace: trivy-operator }
    rules: *helm-release-rules
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-helm-release, namespace: gitea }
    roleRef: &helm-release-role { apiGroup: rbac.authorization.k8s.io, kind: Role, name: nanoclaw-helm-release }
    subjects: &helm-subject
      - { kind: ServiceAccount, name: nanoclaw-helm, namespace: nanoclaw-remediator }
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-helm-release, namespace: nextcloud }
    roleRef: *helm-release-role
    subjects: *helm-subject
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-helm-release, namespace: excalidraw }
    roleRef: *helm-release-role
    subjects: *helm-subject
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-helm-release, namespace: wiki-js }
    roleRef: *helm-release-role
    subjects: *helm-subject
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-helm-release, namespace: logging }
    roleRef: *helm-release-role
    subjects: *helm-subject
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-helm-release, namespace: trivy-operator }
    roleRef: *helm-release-role
    subjects: *helm-subject
---
# Updating a ClusterRole needs escalate and a binding needs bind on its role, so
# both are granted on exactly the chart objects. create cannot be name-scoped, so
# a chart version that adds cluster objects fails and rolls back.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-helm-cluster-rbac
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames:
      [
        fluent-bit,
        trivy-operator,
        aggregate-config-audit-reports-view,
        aggregate-exposed-secret-reports-view,
        aggregate-vulnerability-reports-view,
      ]
    verbs: [get, update, patch, escalate]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [fluent-bit, trivy-operator]
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [fluent-bit, trivy-operator]
    verbs: [get, update, patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-helm-cluster-rbac
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-helm-cluster-rbac }
subjects:
  - { kind: ServiceAccount, name: nanoclaw-helm, namespace: nanoclaw-remediator }
---
# Break-glass. Only the host executor holds this identity (OneCLI agent
# nanoclaw-breakglass), and only to apply an approved Lane C plan. It reads
# everything but Secrets, writes workloads in kube-system and longhorn-system, and
# runs the longhorn helm release. It has no rights on nodes, PVs, PVCs, Longhorn
# volumes or backups, or anything in backups; admission-policy.yaml limits its
# Secret writes to Helm release Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-breakglass
  namespace: nanoclaw-remediator
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: nanoclaw-breakglass-token
  namespace: nanoclaw-remediator
  annotations:
    kubernetes.io/service-account.name: nanoclaw-breakglass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-breakglass-cluster
rules:
  - apiGroups: [""]
    resources:
      [
        configmaps,
        endpoints,
        events,
        limitranges,
        namespaces,
        nodes,
        persistentvolumeclaims,
        persistentvolumes,
        pods,
        pods/log,
        replicationcontrollers,
        resourcequotas,
        serviceaccounts,
        services,
      ]
    verbs: [get, list, watch]
  - apiGroups:
      [
        acme.cert-manager.io,
        admissionregistration.k8s.io,
        apiextensions.k8s.io,
        apps,
        aquasecurity.github.io,
        autoscaling,
        batch,
        cert-manager.io,
        coordination.k8s.io,
        discovery.k8s.io,
        events.k8s.io,
        helm.cattle.io,
        longhorn.io,
        networking.k8s.io,
        policy,
        rbac.authorization.k8s.io,
        scheduling.k8s.io,
        storage.k8s.io,
        traefik.io,
      ]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [longhorn-role, longhorn-csi-role, longhorn-csi-secret-role]
    verbs: [update, patch, escalate, bind]
  # longhorn-support-bundle binds cluster-admin and is left out, so this identity never holds bind on it.
