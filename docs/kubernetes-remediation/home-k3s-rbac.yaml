# REVIEW ONLY. Do not apply without admission-policy.yaml and the policy proxy
# described in approach-2-build-plan.md.
apiVersion: v1
kind: Namespace
metadata:
  name: nanoclaw-remediator
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-remediator
  namespace: nanoclaw-remediator
automountServiceAccountToken: false
---
# Only resources that are genuinely cluster-scoped belong here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [aquasecurity.github.io]
    resources: [clustervulnerabilityreports]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-remediator-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nanoclaw-remediator-cluster-read
subjects:
  - kind: ServiceAccount
    name: nanoclaw-remediator
    namespace: nanoclaw-remediator
---
# REQUIRES PER-ACTION HUMAN APPROVAL. This capability has no binding by
# default. A trusted host process may create a short-lived RoleBinding only
# after Matrix approval and the proxy has installed the approval annotation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-human-approved-pvc-delete
  labels:
    remediation.nanoclaw.io/human-approval: required
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [delete]
---
# REQUIRES PER-ACTION HUMAN APPROVAL. This capability has no binding by
# default; the host binds it for one approved PV delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-human-approved-pv-delete
  labels:
    remediation.nanoclaw.io/human-approval: required
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [delete]
---
# Lane A writes in every namespace. RBAC cannot exclude namespaces, so
# admission-policy.yaml keeps this identity out of Lane C, behind the approval
# annotation in the always-ask namespaces, and from deleting anything in backups.
# PVC and PV deletion come only from the temporary approved bindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-lane-a
rules:
  - apiGroups: [apps]
    resources: [daemonsets, deployments, statefulsets]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, delete]
  - apiGroups: ['']
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list]
  # The pod-exec runner Job runs kubectl in-cluster under this account.
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
---
# The pod-exec runner in nanoclaw-remediator and the build-image Job in security;
# admission-policy.yaml pins what these Jobs may run.
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-jobs
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: v1
kind: List
items:
  - &jobs-binding
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-remediator-jobs, namespace: nanoclaw-remediator }
    roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-jobs }
    subjects: [{ kind: ServiceAccount, name: nanoclaw-remediator, namespace: nanoclaw-remediator }]
  - <<: *jobs-binding
    metadata: { name: nanoclaw-remediator-jobs, namespace: security }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-remediator-lane-a
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-lane-a }
subjects:
  - { kind: ServiceAccount, name: nanoclaw-remediator, namespace: nanoclaw-remediator }
---
# The Trivy watcher lists reports across all namespaces; scan metadata only, read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-trivy-read
rules:
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, clustervulnerabilityreports]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-remediator-trivy-read
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-trivy-read }
subjects:
  - { kind: ServiceAccount, name: nanoclaw-remediator, namespace: nanoclaw-remediator }
---
# Helm and manifest path. Only the host holds this identity (OneCLI agent
# nanoclaw-helm); the agent never does. Cluster-scoped writes are limited to the
# fluent-bit and trivy-operator RBAC, whose rules and subjects admission freezes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-helm
  namespace: nanoclaw-remediator
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: nanoclaw-helm-token
  namespace: nanoclaw-remediator
  annotations:
    kubernetes.io/service-account.name: nanoclaw-helm
---
# Everything in one namespace. enable-remediation.sh binds it for nanoclaw-helm in every
# namespace except kube-system and longhorn-system, and for nanoclaw-breakglass
# below; admission-policy.yaml holds both to the owner's NEVER list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-namespace-admin
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['*']
---
# Updating a ClusterRole needs escalate and a binding needs bind on its role, so
# both are granted on exactly the chart objects. create cannot be name-scoped, so
# a chart version that adds cluster objects fails and rolls back.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-helm-cluster-rbac
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames:
      [
        fluent-bit,
        trivy-operator,
        aggregate-config-audit-reports-view,
        aggregate-exposed-secret-reports-view,
        aggregate-vulnerability-reports-view,
      ]
    verbs: [get, update, patch, escalate]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [fluent-bit, trivy-operator]
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [fluent-bit, trivy-operator]
    verbs: [get, update, patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-helm-cluster-rbac
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-helm-cluster-rbac }
subjects:
  - { kind: ServiceAccount, name: nanoclaw-helm, namespace: nanoclaw-remediator }
---
# Break-glass. Only the host executor holds this identity (OneCLI agent
# nanoclaw-breakglass), and only to apply an approved Lane C plan. It reads
# everything but Secrets cluster-wide, owns kube-system and longhorn-system, and
# updates the longhorn chart's cluster objects; the never guard still applies.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-breakglass
  namespace: nanoclaw-remediator
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: nanoclaw-breakglass-token
  namespace: nanoclaw-remediator
  annotations:
    kubernetes.io/service-account.name: nanoclaw-breakglass
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-breakglass-cluster
rules:
  - apiGroups: [""]
    resources:
      [
        configmaps,
        endpoints,
        events,
        limitranges,
        namespaces,
        nodes,
        persistentvolumeclaims,
        persistentvolumes,
        pods,
        pods/log,
        replicationcontrollers,
        resourcequotas,
        serviceaccounts,
        services,
      ]
    verbs: [get, list, watch]
  - apiGroups:
      [
        acme.cert-manager.io,
        admissionregistration.k8s.io,
        apiextensions.k8s.io,
        apps,
        aquasecurity.github.io,
        autoscaling,
        batch,
        cert-manager.io,
        coordination.k8s.io,
        discovery.k8s.io,
        events.k8s.io,
        helm.cattle.io,
        longhorn.io,
        networking.k8s.io,
        policy,
        rbac.authorization.k8s.io,
        scheduling.k8s.io,
        storage.k8s.io,
        traefik.io,
      ]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [longhorn-role, longhorn-csi-role, longhorn-csi-secret-role]
    verbs: [update, patch, escalate, bind]
  # longhorn-support-bundle binds cluster-admin and is left out, so this identity never holds bind on it.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [longhorn-bind, longhorn-csi-bind, longhorn-csi-secret-bind]
    verbs: [update, patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames:
      - backingimagedatasources.longhorn.io
      - backingimagemanagers.longhorn.io
      - backingimages.longhorn.io
      - backupbackingimages.longhorn.io
      - backups.longhorn.io
      - backuptargets.longhorn.io
      - backupvolumes.longhorn.io
      - enginefrontends.longhorn.io
      - engineimages.longhorn.io
      - engines.longhorn.io
      - instancemanagers.longhorn.io
      - instancemanagerupgradecontrols.longhorn.io
      - instancemanagerupgrades.longhorn.io
      - nodes.longhorn.io
      - orphans.longhorn.io
      - recurringjobs.longhorn.io
      - replicas.longhorn.io
      - settings.longhorn.io
      - shardgroups.longhorn.io
      - shards.longhorn.io
      - sharemanagers.longhorn.io
      - snapshotgroups.longhorn.io
      - snapshots.longhorn.io
      - supportbundles.longhorn.io
      - systembackups.longhorn.io
      - systemrestores.longhorn.io
      - volumeattachments.longhorn.io
      - volumes.longhorn.io
    verbs: [update, patch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    resourceNames: [longhorn-critical]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-breakglass-cluster
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-breakglass-cluster }
subjects:
  - { kind: ServiceAccount, name: nanoclaw-breakglass, namespace: nanoclaw-remediator }

---
apiVersion: v1
kind: List
items:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-breakglass, namespace: kube-system }
    roleRef: &breakglass-role { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-namespace-admin }
    subjects: &breakglass-subject
      - { kind: ServiceAccount, name: nanoclaw-breakglass, namespace: nanoclaw-remediator }
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-breakglass, namespace: longhorn-system }
    roleRef: *breakglass-role
    subjects: *breakglass-subject
