# REVIEW ONLY. Do not apply without admission-policy.yaml and the policy proxy
# described in approach-2-build-plan.md.
apiVersion: v1
kind: Namespace
metadata:
  name: nanoclaw-remediator
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanoclaw-remediator
  namespace: nanoclaw-remediator
automountServiceAccountToken: false
---
# Only resources that are genuinely cluster-scoped belong here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [aquasecurity.github.io]
    resources: [clustervulnerabilityreports]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nanoclaw-remediator-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nanoclaw-remediator-cluster-read
subjects:
  - kind: ServiceAccount
    name: nanoclaw-remediator
    namespace: nanoclaw-remediator
---
# REQUIRES PER-ACTION HUMAN APPROVAL. This capability has no binding by
# default. A trusted host process may create a short-lived RoleBinding only
# after Matrix approval and the proxy has installed the approval annotation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-human-approved-pvc-delete
  labels:
    remediation.nanoclaw.io/human-approval: required
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [delete]
---
# REQUIRES PER-ACTION HUMAN APPROVAL. This capability has no binding by
# default. PV names are the reviewed 2026-10-21 HOME inventory; a new PV needs
# a newly reviewed, name-scoped capability.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nanoclaw-remediator-human-approved-pv-delete
  labels:
    remediation.nanoclaw.io/human-approval: required
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    resourceNames:
      - pvc-12c7a0fa-73cb-469c-bac1-0bfdf2a6cdec
      - pvc-139387bd-c906-434e-bcf7-ad4a9ccb68e5
      - pvc-213b7efc-74fd-44d8-bdc7-2670001cd19f
      - pvc-2726d23a-dd02-4f93-8595-1f16c9b65444
      - pvc-3ac80f11-40a3-4bc6-bd38-354600533318
      - pvc-48f26a2c-0069-4c4a-8b06-4d4454b16cff
      - pvc-4b5f5efe-d6b8-4e8c-b828-e1ab8f49baed
      - pvc-50171553-a2c5-4ab0-993a-3941a4873217
      - pvc-641f8fab-523c-4c9e-a0d1-a726a6d46352
      - pvc-710e32be-ee3b-4698-b2d3-3fb10c22cb47
      - pvc-98ac57cc-385a-46f4-81cb-d12f88d2e879
      - pvc-bf09a202-1a8b-4635-8dd2-c29ca0e14071
      - pvc-c5ad30cd-8718-4610-b3d1-de8635228ce4
      - pvc-c936cc0d-f377-4074-bbb1-9772c9e5b0e4
      - pvc-c9f69649-d742-492a-bd9d-ff33877f83b6
      - pvc-ed4111ff-8bec-4676-9ec0-a187c9842e66
