---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: nanoclaw-remediator-reader-wide }
rules:
  - apiGroups: ['']
    resources: [events, namespaces, nodes, persistentvolumeclaims, persistentvolumes, pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: [engineimages, engines, instancemanagers, nodes, replicas, settings, volumes]
    verbs: [get, list, watch]
  # exposedsecretreports are left out: they quote the secrets they found.
  - apiGroups: [aquasecurity.github.io]
    resources:
      [
        clustercompliancereports,
        clusterconfigauditreports,
        clusterinfraassessmentreports,
        clusterrbacassessmentreports,
        clustersbomreports,
        clustervulnerabilityreports,
        configauditreports,
        infraassessmentreports,
        rbacassessmentreports,
        sbomreports,
        vulnerabilityreports,
      ]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: nanoclaw-remediator-reader-wide }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-reader-wide }
subjects: [{ kind: ServiceAccount, name: nanoclaw-remediator-reader, namespace: nanoclaw-remediator }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: nanoclaw-remediator-reader-inspect }
rules:
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
---
# Bound per namespace so the excluded ones stay out. The security namespace does not
# exist yet; once node-inspector lands, bind it the same way:
# kubectl -n security create rolebinding nanoclaw-remediator-reader-inspect --clusterrole=nanoclaw-remediator-reader-inspect --serviceaccount=nanoclaw-remediator:nanoclaw-remediator-reader
apiVersion: v1
kind: List
items:
  - &inspect-binding
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: cert-manager }
    roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-reader-inspect }
    subjects: [{ kind: ServiceAccount, name: nanoclaw-remediator-reader, namespace: nanoclaw-remediator }]
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: default }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: duckdns }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: excalidraw }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: excalidraw-room }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: gitea }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: hermes }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: logging }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: mail }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: monitoring }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: mpcpi }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: nextcloud }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: openclaw }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: openclaw-private }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: prophet }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: schipperswoning }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: system-upgrade }
  - <<: *inspect-binding
    metadata: { name: nanoclaw-remediator-reader-inspect, namespace: wiki-js }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: nanoclaw-remediator-reader-logs }
rules:
