# Read-only identity for the bot itself; writes go only through the approval-gated executor.
# It reads every namespace but no Secrets, and may read logs and exec into pods for
# read-only inspection everywhere except vaultwarden, wireguard-home, backups,
# kube-system and nanoclaw-remediator. falco, longhorn-system and trivy-operator get
# logs only: their privileged or host-root pods would hand over the node.
apiVersion: v1
kind: ServiceAccount
metadata: { name: nanoclaw-remediator-reader, namespace: nanoclaw-remediator }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: nanoclaw-remediator-reader-token
  namespace: nanoclaw-remediator
  annotations: { kubernetes.io/service-account.name: nanoclaw-remediator-reader }
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: nanoclaw-remediator-reader-cluster-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-cluster-read }
subjects: [{ kind: ServiceAccount, name: nanoclaw-remediator-reader, namespace: nanoclaw-remediator }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: nanoclaw-remediator-reader-trivy-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-trivy-read }
subjects: [{ kind: ServiceAccount, name: nanoclaw-remediator-reader, namespace: nanoclaw-remediator }]
