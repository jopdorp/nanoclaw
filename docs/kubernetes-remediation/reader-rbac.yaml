# Read identity for the bot itself; writes go only through the host executor.
# enable-remediation.sh generates the rest, idempotently, from the live cluster:
# - ClusterRole nanoclaw-remediator-reader-wide: get/list/watch on every listable
#   resource but Secrets, plus pod logs, bound cluster-wide below;
# - a nanoclaw-remediator-reader-secrets RoleBinding in every namespace except
#   vaultwarden, nanoclaw-remediator and orfie-ci, whose tokens would read vaultwarden's or upgrade Orfie;
# - a nanoclaw-remediator-reader-inspect RoleBinding in every namespace except
#   wireguard-home, kube-system and longhorn-system, where changes need approval and
#   exec runs as a pod-exec plan, nanoclaw-remediator and orfie-ci.
apiVersion: v1
kind: ServiceAccount
metadata: { name: nanoclaw-remediator-reader, namespace: nanoclaw-remediator }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: nanoclaw-remediator-reader-token
  namespace: nanoclaw-remediator
  annotations: { kubernetes.io/service-account.name: nanoclaw-remediator-reader }
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: nanoclaw-remediator-reader-wide }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: nanoclaw-remediator-reader-wide }
subjects: [{ kind: ServiceAccount, name: nanoclaw-remediator-reader, namespace: nanoclaw-remediator }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: nanoclaw-remediator-reader-secrets }
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: nanoclaw-remediator-reader-inspect }
rules:
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
